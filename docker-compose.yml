services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/node_modules

  mobile:
    build:
      context: .
      dockerfile: mobile/Dockerfile
      target: dev
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app/mobile
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  backend_node_modules:
  mobile_node_modules:
