name: Mobile CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm -w mobile run typecheck

      - name: Expo doctor
        run: npx expo-doctor
        working-directory: mobile
